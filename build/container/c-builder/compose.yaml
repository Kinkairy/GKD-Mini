services:
  c-builder:
    image: local/c-builder:2026.07.15
    build:
      context: .
    container_name: c-builder
    init: true
    restart: unless-stopped
    command: ["sleep", "infinity"]
    working_dir: /workspace
    volumes:
      - /srv/c-builder/workspace:/workspace
      - /srv/c-builder/ccache:/ccache
      - /srv/c-builder/toolchains:/opt/toolchains
    environment:
      CCACHE_DIR: /ccache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
